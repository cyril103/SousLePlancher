 salon : y ≈ 2,04 unités Godot ; ce dénivelé local ne correspond pas à l’étage N+1 de la maison.</text><text x="50" y="905" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#5f665d" text-anchor="start">LÉGENDE</text><polyline points="50,939 115,939" fill="none" stroke="#37796b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="130" y="945" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#282f2a" text-anchor="start">Seuil existant • fonction partielle</text><polyline points="550,939 615,939" fill="none" stroke="#9b692b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7"/><text x="630" y="945" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#282f2a" text-anchor="start">Liaison de campagne proposée</text><polyline points="1050,939 1115,939" fill="none" stroke="#776282" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 9"/><text x="1130" y="945" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#282f2a" text-anchor="start">Extension différée</text><text x="50" y="1024" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#5f665d" text-anchor="start">Carte de conception • tracés futurs à valider • aucune dimension physique définitive • pas une capture du jeu</text></svg>