<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" role="img"><title>La maison en coupe</title><desc>Niveaux topologiques de conception ; hauteurs non cotées. Les volumes de la maison ne sont pas des secteurs jouables entiers.</desc><defs><pattern id="wood" width="150" height="72" patternUnits="userSpaceOnUse"><rect width="150" height="72" fill="#e7deca"/><path d="M0 71H150 M30 12H130 M8 25H75 M78 51H148" stroke="#cfc1a7" stroke-width="1"/></pattern><pattern id="danger" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-2 2L10 14 M2 -2L14 10" stroke="#ae5046" stroke-opacity=".28" stroke-width="2"/></pattern></defs><rect x="0" y="0" width="1600" height="1060" rx="0" fill="#f2eddf" stroke="#f2eddf" /><text x="50" y="40" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#5f665d" text-anchor="start">SOUS LE PLANCHER  /  ATLAS DE CONCEPTION V01  /  25 SEPTEMBRE 2026</text><text x="50" y="91" font-family="Georgia, serif" font-size="38" font-weight="400" fill="#282f2a" text-anchor="start">La maison en coupe</text><text x="50" y="126" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#5f665d" text-anchor="start">Niveaux topologiques de conception ; hauteurs non cotées. Les volumes de la maison ne sont pas des secteurs jouables entiers.</text><path d="M50 147H1550" stroke="#b8af9b"/><rect x="190" y="190" width="1130" height="95" rx="5" fill="#e9e0dc" stroke="#c3bcaa" /><text x="65" y="239" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#282f2a" text-anchor="start">N+2</text><text x="220" y="228" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#282f2a" text-anchor="start">Grenier • E02 • différé</text><text x="220" y="259" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#5f665d" text-anchor="start">Extension future</text><rect x="190" y="310" width="1130" height="95" rx="5" fill="#e4e4d9" stroke="#c3bcaa" /><text x="65" y="359" font-family=